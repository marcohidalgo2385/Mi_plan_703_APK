# Pruebas de la API (el motor del TFM) en cada cambio del backend.
name: Pruebas API

on:
  push:
    paths: ['backend/**', '.github/workflows/api-tests.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests
